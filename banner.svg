<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Noureddine Ennomani - Étudiant en Réseaux, Cloud et Cybersécurité - Recherche un stage de 3 mois">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#1b222c" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <linearGradient id="gName" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#00ff9c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- révélation progressive de chaque ligne (cycle de 15 s) -->
    <clipPath id="c1"><rect x="40" y="50" width="0" height="34">
      <animate attributeName="width" values="0;0;80;80;0" keyTimes="0;0.03;0.08;0.95;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="82" width="0" height="48">
      <animate attributeName="width" values="0;0;470;470;0" keyTimes="0;0.10;0.22;0.95;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="128" width="0" height="34">
      <animate attributeName="width" values="0;0;135;135;0" keyTimes="0;0.26;0.31;0.95;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="154" width="0" height="34">
      <animate attributeName="width" values="0;0;395;395;0" keyTimes="0;0.33;0.45;0.95;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="184" width="0" height="34">
      <animate attributeName="width" values="0;0;172;172;0" keyTimes="0;0.49;0.56;0.95;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c6"><rect x="40" y="210" width="0" height="30">
      <animate attributeName="width" values="0;0;330;330;0" keyTimes="0;0.58;0.66;0.95;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c7"><rect x="40" y="238" width="0" height="30">
      <animate attributeName="width" values="0;0;460;460;0" keyTimes="0;0.68;0.80;0.95;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- fenêtre -->
  <rect x="10" y="10" width="880" height="300" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="10" y="10" width="880" height="300" rx="10" fill="url(#grid)" opacity="0.8"/>

  <!-- barre de titre -->
  <path d="M10 40 V20 a10 10 0 0 1 10 -10 H880 a10 10 0 0 1 10 10 V40 Z" fill="#161b22"/>
  <circle cx="32" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="25" r="6" fill="#27c93f"/>
  <text x="450" y="29" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#8b949e">noureddine@ennomani: ~/profil — ssh</text>

  <!-- terminal : largeur des textes fixée avec textLength pour éviter toute coupure -->
  <g font-family="'Courier New', Consolas, monospace" font-size="15">
    <g clip-path="url(#c1)"><text x="40" y="72" textLength="74" lengthAdjust="spacingAndGlyphs"><tspan fill="#00ff9c">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text></g>
    <g clip-path="url(#c2)"><text x="40" y="118" font-size="40" font-weight="700" fill="url(#gName)" filter="url(#glow)" textLength="456" lengthAdjust="spacingAndGlyphs">Noureddine Ennomani</text></g>
    <g clip-path="url(#c3)"><text x="40" y="152" textLength="129" lengthAdjust="spacingAndGlyphs"><tspan fill="#00ff9c">$</tspan><tspan fill="#e6edf3"> cat role.txt</tspan></text></g>
    <g clip-path="url(#c4)"><text x="40" y="180" fill="#ffb000" textLength="386" lengthAdjust="spacingAndGlyphs">Étudiant en Réseaux, Cloud &amp; Cybersécurité</text></g>
    <g clip-path="url(#c5)"><text x="40" y="210" textLength="166" lengthAdjust="spacingAndGlyphs"><tspan fill="#00ff9c">$</tspan><tspan fill="#e6edf3"> ./status --stage</tspan></text></g>
    <g clip-path="url(#c6)"><text x="40" y="232" textLength="322" lengthAdjust="spacingAndGlyphs"><tspan fill="#00ff9c">[ OK ]</tspan><tspan fill="#c9d1d9"> Recherche un stage de 3 mois</tspan></text></g>
    <g clip-path="url(#c7)"><text x="40" y="256" textLength="451" lengthAdjust="spacingAndGlyphs"><tspan fill="#00ff9c">[ OK ]</tspan><tspan fill="#8b949e"> Domaines : réseaux · cloud · cybersécurité</tspan></text></g>
  </g>
  <!-- curseur -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.81;0.95;1" dur="15s" repeatCount="indefinite"/>
    <rect x="496" y="244" width="9" height="16" fill="#00ff9c">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- séparateur -->
  <line x1="545" y1="56" x2="545" y2="262" stroke="#30363d" stroke-dasharray="3 5"/>

  <!-- schéma réseau -->
  <g font-family="'Courier New', Consolas, monospace" font-size="11">
    <text x="565" y="62" fill="#8b949e">// topologie</text>

    <!-- liens -->
    <g stroke="#00d4ff" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 6" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/>
      <path d="M718 112 L632 168"/>
      <path d="M718 112 L804 168"/>
      <path d="M632 168 L804 168"/>
      <path d="M632 168 L718 232"/>
      <path d="M804 168 L718 232"/>
    </g>

    <!-- paquets -->
    <g fill="#00ff9c" filter="url(#glow)">
      <circle r="3"><animateMotion dur="2.4s" repeatCount="indefinite" path="M718 112 L632 168"/></circle>
      <circle r="3"><animateMotion dur="3s" repeatCount="indefinite" path="M632 168 L804 168"/></circle>
      <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite" path="M804 168 L718 232"/></circle>
      <circle r="3"><animateMotion dur="3.4s" repeatCount="indefinite" path="M718 112 L804 168"/></circle>
      <circle r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M632 168 L718 232"/></circle>
    </g>

    <!-- noeuds -->
    <g text-anchor="middle">
      <rect x="678" y="96" width="80" height="30" rx="6" fill="#0d1117" stroke="#00d4ff"/>
      <text x="718" y="115" fill="#00d4ff">CLOUD</text>

      <rect x="592" y="152" width="80" height="30" rx="6" fill="#0d1117" stroke="#ff5f56"/>
      <text x="632" y="171" fill="#ff5f56">pfSense</text>

      <rect x="764" y="152" width="80" height="30" rx="6" fill="#0d1117" stroke="#00ff9c"/>
      <text x="804" y="171" fill="#00ff9c">Proxmox</text>

      <rect x="678" y="216" width="80" height="30" rx="6" fill="#0d1117" stroke="#ffb000"/>
      <text x="718" y="235" fill="#ffb000">VLAN</text>
    </g>
    <rect x="678" y="96" width="80" height="30" rx="6" fill="none" stroke="#00d4ff" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- effet écran (lignes de balayage) -->
  <rect x="10" y="40" width="880" height="242" fill="url(#scan)"/>

  <!-- barre de statut -->
  <path d="M10 282 H890 V300 a10 10 0 0 1 -10 10 H20 a10 10 0 0 1 -10 -10 Z" fill="#161b22"/>
  <path d="M10 282 H150 V310 H20 a10 10 0 0 1 -10 -10 Z" fill="#00ff9c"/>
  <circle cx="28" cy="296" r="4" fill="#0d1117">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <g font-family="'Courier New', Consolas, monospace" font-size="12">
    <text x="40" y="300" fill="#0d1117" font-weight="700" textLength="100" lengthAdjust="spacingAndGlyphs">STAGE 3 MOIS</text>
    <text x="168" y="300" fill="#c9d1d9" textLength="236" lengthAdjust="spacingAndGlyphs">Étudiant · Réseaux · Cloud · Cyber</text>
    <text x="428" y="300" fill="#8b949e" textLength="144" lengthAdjust="spacingAndGlyphs">ESTK · Bachelor 2027</text>
    <text x="596" y="300" fill="#8b949e" textLength="100" lengthAdjust="spacingAndGlyphs">Ouarzazate, MA</text>
    <text x="870" y="300" text-anchor="end" fill="#ffb000">FR · EN</text>
  </g>
</svg>
